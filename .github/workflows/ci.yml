name: CI

on:
  pull_request:
  push:
    branches: [main]

# Read-only token: this workflow never writes to the repository or publishes.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # actions/setup-python has no Python 3.9 build for ubuntu-latest
          # (26.04); 3.9 builds exist for ubuntu-22.04 and ubuntu-24.04.
          - python-version: "3.9"
            os: ubuntu-24.04
          - python-version: "3.11"
            os: ubuntu-latest
          - python-version: "3.13"
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install .

      - name: Run tests
        run: python -m unittest discover -v

  package:
    name: build and check distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build wheel and sdist
        run: |
          python -m pip install --upgrade pip build twine
          python -m build

      - name: Check distributions
        run: python -m twine check --strict dist/*

  whitespace:
    name: whitespace (git diff --check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      # Check only the changes being proposed or pushed, so whitespace that
      # already exists on main does not fail unrelated work.
      - name: Check changed lines for whitespace errors
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            git diff --check "origin/${BASE_REF}...HEAD"
          elif [ -n "$BEFORE_SHA" ] && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
            git diff --check "$BEFORE_SHA" HEAD
          else
            git diff --check HEAD~1 HEAD
          fi

  intermol:
    name: InterMol/LAMMPS energy validation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Pin InterMol so upstream changes cannot silently alter this validation.
      - uses: actions/checkout@v4
        with:
          repository: shirtsgroup/InterMol
          ref: 7125764d42f6e6c589dc2d1df71e3e812b3a7b27
          path: intermol
          persist-credentials: false

      # Cache the pinned executable. The key includes the runner platform,
      # source commit, compiler family, enabled packages, and a format version.
      - name: Restore pinned LAMMPS build
        id: cache-lammps
        uses: actions/cache@v4
        with:
          path: lammps-build/lmp
          key: lammps-${{ runner.os }}-${{ runner.arch }}-ubuntu24-gcc-26e5f79-molecule-extra_molecule-kspace-v1

      # Ubuntu's LAMMPS package omits EXTRA-MOLECULE, which provides the
      # Fourier dihedral style emitted by AMBER2LAMMPS. On a cache miss, build
      # the same stable release used for local validation.
      - uses: actions/checkout@v4
        if: steps.cache-lammps.outputs.cache-hit != 'true'
        with:
          repository: lammps/lammps
          ref: 26e5f79b4e5aa77b65fc4fbf314b206bf0530b45
          path: lammps-source
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install AMBER2LAMMPS
        run: |
          python -m pip install --upgrade pip
          # InterMol imports six but does not declare it in its package metadata.
          python -m pip install . six==1.17.0

      - name: Build LAMMPS with required packages
        if: steps.cache-lammps.outputs.cache-hit != 'true'
        run: |
          cmake -S lammps-source/cmake -B lammps-build \
            -D CMAKE_BUILD_TYPE=Release \
            -D BUILD_MPI=off \
            -D PKG_MOLECULE=on \
            -D PKG_EXTRA-MOLECULE=on \
            -D PKG_KSPACE=on
          cmake --build lammps-build --parallel 2

      - name: Compare fresh InterMol and AMBER2LAMMPS energies
        run: python validation/validate_intermol.py --intermol-dir intermol --lammps lammps-build/lmp

  # Single stable check name for branch protection, independent of the matrix.
  ci-passed:
    name: CI passed
    if: always()
    needs: [test, package, whitespace, intermol]
    runs-on: ubuntu-latest
    steps:
      - name: Require all CI jobs to succeed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for result in $RESULTS; do
            if [ "$result" != "success" ]; then
              echo "A required CI job did not succeed."
              exit 1
            fi
          done
